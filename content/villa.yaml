# Villa Dolce & Azzurra: single source of truth for every fact on the site.
# Rules:
#   - Pages must read facts from this file, never retype them.
#   - Values marked TODO_OWNER are unknown. Do NOT invent them: leave the feature out
#     or render nothing, and list it in the build report for the owner.
#   - `verified: false` means the fact comes from one source only; show it, but
#     list it in the build report.

site:
  domain: "https://www.dolceazzurra.com"   # canonical origin (www)
  cname: "www.dolceazzurra.com"            # content of public/CNAME
  default_locale: en
  locales:
    # status: live  -> built, linked in the language switcher, in sitemap/hreflang
    # status: draft -> NOT built. Flip to live only after a native speaker reviewed it.
    - { code: en, name: English,    status: live,  reviewer: owner }
    - { code: fr, name: Français,   status: live,  reviewer: owner }
    - { code: it, name: Italiano,   status: live,  reviewer: owner }
    - { code: de, name: Deutsch,    status: draft, reviewer: native-freelancer }
    - { code: nl, name: Nederlands, status: draft, reviewer: native-freelancer }
  legacy_lang_param: true   # old site used /?lang=fr etc. Root page must redirect these.

